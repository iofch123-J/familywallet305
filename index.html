<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17223b">
<meta name="robots" content="noindex, nofollow">
<title>가족회비</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317223b'/%3E%3Cpath d='M21 25v-7a1 1 0 0 0-1-1h-8a1 1 0 0 0-1 1v7M6 14a2 2 0 0 1 .7-1.5l8-6.9a2 2 0 0 1 2.6 0l8 6.9A2 2 0 0 1 26 14v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --navy:#17223b; --navy2:#24345a;
    --blue1:#5d8ff6; --blue2:#3f6fe0; --violet:#7c86f3;
    --bg:#e9eef6; --surface:#f5f7fb; --card:#fff; --line:#eef1f6;
    --text:#1b2336; --sub:#8791a5; --red:#ef3b4f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;word-break:keep-all}
  button,select{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer}
  svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--surface);position:relative;overflow:hidden;display:flex;flex-direction:column}
  @media (min-width:520px){.app{margin:28px auto;min-height:calc(100vh - 56px);border-radius:28px;box-shadow:0 24px 60px rgba(23,34,59,.16)}}

  /* 상단 */
  .top{background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 44px}
  .bar{display:flex;align-items:center;gap:10px;height:48px}
  .bar .logo{width:30px;height:30px}
  .bar h1{flex:1;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;margin-right:-8px}
  .iconbtn:active{background:rgba(255,255,255,.12)}

  .balance{position:relative;overflow:hidden;margin-top:14px;border-radius:20px;padding:22px 22px 26px;background:linear-gradient(135deg,var(--blue1) 0%,var(--blue2) 58%,var(--violet) 100%);box-shadow:0 12px 30px rgba(40,80,190,.35)}
  .balance::before,.balance::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
  .balance::before{width:220px;height:220px;right:-70px;top:-90px}
  .balance::after{width:160px;height:160px;right:30px;bottom:-110px}
  .balance .label{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
  .balance .label svg{width:22px;height:22px}
  .balance .today{position:relative;margin-left:auto;font-size:13px;font-weight:500;opacity:.9;font-variant-numeric:tabular-nums}
  .balance .amount{position:relative;margin-top:10px;font-size:clamp(32px,10vw,42px);font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
  .balance .amount small{font-size:.55em;font-weight:700;margin-left:4px}

  .alerts:empty{display:none}
  .alert{display:flex;margin-top:10px;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 14px;font-size:13px;line-height:1.5}
  .alert svg{width:18px;height:18px;margin-top:1px}
  .alert b{font-weight:700}
  .alert.warn{background:#fff6e5;color:#86500c}
  .alert.warn svg{color:#e08a00}
  .alert.event{background:rgba(255,255,255,.1);color:#fff}
  .alert.event svg{color:#9cc0ff}
  .alert.event .dd{margin-left:auto;padding-left:8px;font-weight:800;color:#9cc0ff;white-space:nowrap}

  /* 지출 내역 */
  .list{position:relative;margin:-24px 12px 0;background:var(--card);border-radius:20px;box-shadow:0 6px 24px rgba(23,34,59,.07);overflow:hidden}
  .list-head{display:flex;align-items:center;gap:8px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
  .list-head .hicon{width:24px;height:24px;color:#2f9ad8}
  .list-head h2{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .count{font-size:13px;color:var(--sub);font-weight:500}
  .select{margin-left:auto;position:relative}
  .select select{appearance:none;-webkit-appearance:none;border:1px solid #e1e6ef;border-radius:999px;background:#fff;padding:8px 30px 8px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .select svg{position:absolute;right:10px;top:50%;width:15px;height:15px;transform:translateY(-50%);pointer-events:none;color:var(--sub)}

  .row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;padding:7px 16px;border-bottom:1px solid var(--line)}
  .row .date{display:none;font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
  .cat{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
  .cat svg{width:17px;height:17px}
  .row .body{min-width:0}
  .row .t{font-size:15px;font-weight:700;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .row .c{margin-top:1px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
  .row .amt{font-size:16px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
  @media (min-width:420px){
    .row{grid-template-columns:78px 34px 1fr auto}
    .row .date{display:block}
    .row .c{display:none}
  }

  .empty{padding:48px 16px;text-align:center;color:var(--sub);font-size:14px}
  .sk{height:12px;border-radius:6px;background:linear-gradient(90deg,#eef1f6 25%,#f7f9fc 50%,#eef1f6 75%);background-size:200% 100%;animation:sk 1.2s infinite}
  @keyframes sk{to{background-position:-200% 0}}

  .pager{display:flex;justify-content:center;align-items:center;gap:4px;padding:14px 8px}
  .pager:empty{display:none}
  .pager button{min-width:36px;height:36px;padding:0 6px;border-radius:10px;font-size:14px;font-weight:600;color:var(--sub);display:grid;place-items:center}
  .pager button.on{background:var(--navy);color:#fff}
  .pager button:disabled{opacity:.3;cursor:default}
  .pager svg{width:18px;height:18px}

  .foot{margin-top:auto;padding-top:24px;line-height:0}
  .foot svg{width:100%;height:64px;display:block}

  /* 메뉴 */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.38);opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.show{opacity:1;pointer-events:auto}
  .menu{position:absolute;z-index:41;top:calc(64px + env(safe-area-inset-top));right:12px;min-width:190px;padding:6px;background:#fff;border-radius:16px;box-shadow:0 16px 40px rgba(15,23,42,.22);transform-origin:top right;transform:scale(.94);opacity:0;pointer-events:none;transition:transform .16s,opacity .16s}
  .menu.show{transform:none;opacity:1;pointer-events:auto}
  .menu button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:10px;font-size:15px;font-weight:600;text-align:left}
  .menu button:hover,.menu button:active{background:#f2f5fa}
  .menu button svg{width:20px;height:20px;color:#5b6780}
  .menu hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
  .menu .danger,.menu .danger svg{color:#d6334a}

  /* 회비 규칙 */
  .sheet{position:fixed;z-index:45;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:82vh;display:flex;flex-direction:column;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(15,23,42,.2);transform:translateY(105%);transition:transform .25s ease}
  .sheet.show{transform:none}
  .sheet-head{display:flex;align-items:center;padding:18px 12px 12px 20px;border-bottom:1px solid var(--line)}
  .sheet-head h3{flex:1;font-size:18px;font-weight:800}
  .sheet-head .iconbtn{margin:0;color:var(--sub)}
  .sheet-body{overflow:auto;overscroll-behavior:contain;padding:8px 20px calc(24px + env(safe-area-inset-bottom))}
  .rule{padding:14px 0;border-bottom:1px solid var(--line)}
  .rule:last-child{border-bottom:0}
  .rule h4{font-size:15px;font-weight:700}
  .rule h4{display:flex;align-items:center;gap:8px}
  .rule h4::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--blue2)}
  .rule dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:8px;font-size:14px;line-height:1.6}
  .rule dt{color:var(--sub)}
  .rule dd{color:#3d475f;overflow-wrap:anywhere}
  .rule .next{color:var(--blue2);font-weight:600}

  /* 비밀번호 */
  .pin{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;background:rgba(23,34,59,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .pin.show{display:flex}
  .pin .lock{width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.1);display:grid;place-items:center}
  .pin .lock svg{width:28px;height:28px}
  .pin h2{margin-top:18px;font-size:20px;font-weight:700}
  .pin .hint{margin-top:6px;font-size:14px;opacity:.65}
  .dots{display:flex;gap:18px;margin:30px 0 14px}
  .dots span{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.5);transition:background .1s}
  .dots span.on{background:#fff;border-color:#fff}
  .dots.busy span{animation:pulse .8s infinite alternate}
  .dots.shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
  @keyframes pulse{to{opacity:.35}}
  .pin .msg{min-height:20px;font-size:13px;color:#ffb3bd;text-align:center}
  .pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 24px;margin-top:18px}
  .pad button{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.09);font-size:26px;font-weight:600;display:grid;place-items:center;transition:background .1s}
  .pad button:active{background:rgba(255,255,255,.24)}
  .pad .ghost{background:none}
  .pad svg{width:26px;height:26px}

  .toast{position:fixed;z-index:70;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(23,34,59,.94);color:#fff;font-size:14px;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="bar">
      <svg class="i logo" viewBox="0 0 24 24"><use href="#i-home"/></svg>
      <h1>가족회비</h1>
      <button class="iconbtn" id="menuBtn" aria-label="메뉴"><svg class="i" viewBox="0 0 24 24"><use href="#i-menu"/></svg></button>
    </div>
    <section class="balance">
      <div class="label"><svg class="i" viewBox="0 0 24 24"><use href="#i-wallet"/></svg>현재 잔액<span class="today" id="today"></span></div>
      <div class="amount" id="balance">—</div>
    </section>
    <div class="alerts" id="alerts" role="status"></div>
  </header>

  <main class="list">
    <div class="list-head">
      <svg class="i hicon" viewBox="0 0 24 24"><use href="#i-wallet"/></svg>
      <h2>지출내역</h2>
      <span class="count" id="count"></span>
      <label class="select">
        <select id="period" aria-label="조회 기간">
          <option value="all">전체</option>
          <option value="30d">최근 30일</option>
          <option value="3m">최근 3개월</option>
          <option value="1y">최근 1년</option>
        </select>
        <svg class="i" viewBox="0 0 24 24"><use href="#i-down"/></svg>
      </label>
    </div>
    <div id="rows"></div>
    <nav class="pager" id="pager" aria-label="페이지"></nav>
  </main>

  <div class="foot" aria-hidden="true">
    <svg viewBox="0 0 480 64" preserveAspectRatio="none">
      <path d="M0 40 C60 18 120 22 180 36 S300 60 360 38 S450 20 480 30 V64 H0Z" fill="#d7e3f4"/>
      <path d="M0 52 C80 34 150 40 230 50 S380 60 480 44 V64 H0Z" fill="#c3dccb"/>
    </svg>
  </div>

  <nav class="menu" id="menu">
    <button data-act="refresh"><svg class="i" viewBox="0 0 24 24"><use href="#i-refresh"/></svg>새로고침</button>
    <button data-act="rules"><svg class="i" viewBox="0 0 24 24"><use href="#i-rules"/></svg><span class="rules-name"></span></button>
    <hr>
    <button data-act="logout" class="danger"><svg class="i" viewBox="0 0 24 24"><use href="#i-logout"/></svg>로그아웃</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <h3 id="sheetTitle" class="rules-name"></h3>
    <button class="iconbtn" id="sheetClose" aria-label="닫기"><svg class="i" viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
  </div>
  <div class="sheet-body" id="rules"></div>
</section>

<section class="pin" id="pin" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
  <div class="lock"><svg class="i" viewBox="0 0 24 24"><use href="#i-lock"/></svg></div>
  <h2 id="pinTitle">가족회비</h2>
  <p class="hint">비밀번호 4자리를 입력하세요</p>
  <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
  <p class="msg" id="pinMsg"></p>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <span></span><button data-k="0">0</button>
    <button class="ghost" data-k="del" aria-label="지우기"><svg class="i" viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
  </div>
</section>

<div class="toast" id="toast"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
  <symbol id="i-rules" viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6M18 9l-6 6"/></symbol>
  <!-- 분류 아이콘 -->
  <symbol id="c-swap" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></symbol>
  <symbol id="c-home" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="c-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="c-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="c-cake" viewBox="0 0 24 24"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20M7 8v3M12 8v3M17 8v3M7 4h.01M12 4h.01M17 4h.01"/></symbol>
  <symbol id="c-cap" viewBox="0 0 24 24"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></symbol>
  <symbol id="c-plane" viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></symbol>
  <symbol id="c-car" viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></symbol>
  <symbol id="c-cross" viewBox="0 0 24 24"><path d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2c0 1.1.9 2 2 2h5v5c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z"/></symbol>
  <symbol id="c-box" viewBox="0 0 24 24"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></symbol>
  <symbol id="c-food" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></symbol>
  <symbol id="c-etc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
</svg>

<script>
/* ===== 설정 ===== */
// Apps Script 웹앱 URL (배포 → 배포 관리에서 복사, .../exec 로 끝나는 주소)
const API_URL = 'https://script.google.com/macros/s/AKfycbyFL3rjjeDcBB0DSh0D6nSdZ_wquESgmHBZh2mWrOZPgZ6JREaz28EVCt--vMLfn8iG/exec';
const RULES_NAME = '회비 규칙';   // 햄버거 메뉴의 공지 이름
const PAGE_SIZE = 10;
const ALERT_DAYS = 30;           // 경조사 며칠 전부터 알림

// 항목(I열) 키워드 → 분류. 위에서부터 먼저 맞는 규칙이 적용됩니다.
const CATEGORIES = [
  { name: '정산',        re: /반환|회수|선지출/,                                   icon: 'swap',  fg: '#5b6780', bg: '#eef1f6' },
  { name: '부모님 생활비', re: /생활비/,                                            icon: 'home',  fg: '#16a34a', bg: '#dcfce7' },
  { name: '어버이날',     re: /어버이날/,                                          icon: 'heart', fg: '#e11d48', bg: '#ffe4e6' },
  { name: '명절',        re: /(^|[^가-힣])(설날?|추석)(?![가-힣])/,                  icon: 'moon',  fg: '#c27c00', bg: '#fef3c7' },
  { name: '생신',        re: /생신|칠순/,                                          icon: 'cake',  fg: '#db2777', bg: '#fce7f3' },
  { name: '자녀 행사',    re: /입대|수료식|면회|휴가|제대|졸업/,                        icon: 'cap',   fg: '#7c3aed', bg: '#ede9fe' },
  { name: '여행·나들이',  re: /여행|나들이|물놀이|레일바이크|제주/,                      icon: 'plane', fg: '#0284c7', bg: '#e0f2fe' },
  { name: '차량',        re: /코란도|수리|주유/,                                    icon: 'car',   fg: '#0f766e', bg: '#ccfbf1' },
  { name: '의료',        re: /수술|간호|병원|약국/,                                  icon: 'cross', fg: '#dc2626', bg: '#fee2e2' },
  { name: '식사',        re: /식사|점심|저녁|카페|커피|가든|음식/,                     icon: 'food',  fg: '#2563eb', bg: '#dbeafe' },
  { name: '물품·가전',    re: /세탁기|건조기|에어컨|티비|TV|옷장|예초기|소모품|(^|[^가-힣])이사(?![가-힣])/, icon: 'box', fg: '#ea580c', bg: '#ffedd5' }
];
const ETC = { name: '기타', icon: 'etc', fg: '#64748b', bg: '#f1f5f9' };

/* ===== 상태 ===== */
let DATA = null, page = 1, pin = '', busy = false;
const $ = id => document.getElementById(id);

/* ===== 유틸 ===== */
// 로그인 토큰은 메모리에만 보관 → 페이지를 열 때마다 비밀번호 입력 (새로고침 메뉴용으로만 사용)
let TOKEN = null;
const store = { get: () => TOKEN, set: v => { TOKEN = v; }, del: () => { TOKEN = null; } };
try { localStorage.removeItem('fw305_token'); } catch (e) {} // 이전 버전이 저장한 토큰 정리
// text/plain 으로 보내면 CORS 사전 요청 없이 Apps Script 에 전달됩니다
async function call(action, arg) {
  if (!API_URL) throw new Error('API_URL 미설정');
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, arg: arg })
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
const won = n => Math.round(n).toLocaleString('ko-KR');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dot = s => s ? s.replace(/-/g, '.') : '';
const classify = t => CATEGORIES.find(c => c.re.test(t)) || ETC;
const WEEK = '일월화수목금토';
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const fullDate = d => dot(ymd(d)) + ' (' + WEEK[d.getDay()] + ')';
const shortDate = d => (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')';

/* ===== 날짜 규칙 (회비 규칙 시트 D열) ===== */
// 한국 음력 데이터 (2020~2060년)
// 연도: [설날의 양력 날짜 MMDD, 윤달(0=없음), 달별 길이 1=30일·0=29일 (윤달 포함 순서)]
const LUNAR_DATA = {
  2020:['0125',4,'1011010010101'],
  2021:['0212',0,'011010101010'],
  2022:['0201',0,'101011010101'],
  2023:['0122',2,'0101010110101'],
  2024:['0210',0,'010010110110'],
  2025:['0129',6,'1010010101110'],
  2026:['0217',0,'101001010111'],
  2027:['0207',0,'010100100111'],
  2028:['0127',5,'0110100100110'],
  2029:['0213',0,'110110010011'],
  2030:['0203',0,'010110101010'],
  2031:['0123',3,'1010101101010'],
  2032:['0211',0,'100101101101'],
  2033:['0131',11,'0100101011101'],
  2034:['0219',0,'010010101110'],
  2035:['0208',0,'101001001101'],
  2036:['0128',6,'1101001001101'],
  2037:['0215',0,'110100100101'],
  2038:['0204',0,'110101010010'],
  2039:['0124',5,'1101101010100'],
  2040:['0212',0,'101101101010'],
  2041:['0201',0,'100101101101'],
  2042:['0122',2,'0100101011011'],
  2043:['0210',0,'010010011011'],
  2044:['0130',7,'1010010010111'],
  2045:['0217',0,'101001001011'],
  2046:['0206',0,'101100100101'],
  2047:['0126',5,'1011010100101'],
  2048:['0214',0,'011011010100'],
  2049:['0202',0,'101011011010'],
  2050:['0123',3,'1001010110110'],
  2051:['0211',0,'100100111011'],
  2052:['0201',8,'0100100110111'],
  2053:['0219',0,'010010010111'],
  2054:['0208',0,'011001001011'],
  2055:['0128',6,'0110101001010'],
  2056:['0215',0,'111010100101'],
  2057:['0204',0,'011010110010'],
  2058:['0124',4,'1010110101100'],
  2059:['0212',0,'101010110110'],
  2060:['0202',0,'100100110111']
};

// 음력 y년 m월 d일(평달) → 양력 Date. 데이터 범위 밖이면 null
function lunarToSolar(y, m, d) {
  const info = LUNAR_DATA[y];
  if (!info) return null;
  const [ny, leap, bits] = info;
  const idx = m - 1 + (leap && leap < m ? 1 : 0); // 윤달이 앞에 있으면 한 칸 뒤
  let days = 0;
  for (let i = 0; i < idx; i++) days += bits[i] === '1' ? 30 : 29;
  const len = bits[idx] === '1' ? 30 : 29;
  return new Date(y, +ny.slice(0, 2) - 1, +ny.slice(2) + days + Math.min(d, len) - 1);
}

function nextDate(ev) {
  const base = today0();
  for (let y = base.getFullYear() - 1; y <= base.getFullYear() + 1; y++) {
    const d = ev.lunar ? lunarToSolar(y, ev.m, ev.d) : new Date(y, ev.m - 1, ev.d);
    if (d && d >= base) return { date: d, days: Math.round((d - base) / 86400000) };
  }
  return null;
}

// "음력1/1", "5/8", "아버지 음력 1953.9.7, 엄마 양력 1955.2.14" 등을 해석
function parseEvents(notices) {
  const all = [];
  notices.forEach(n => {
    n.events = [];
    String(n.date || '').split(/[,，、]/).forEach(part => {
      const m = part.match(/(음력|양력)?\s*(?:\d{4}\s*[.\-/년]\s*)?(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/);
      if (!m) return;
      const who = part.slice(0, m.index).replace(/음력|양력/g, '').trim();
      const ev = { who: who, label: who ? who + ' ' + n.name : n.name, lunar: m[1] === '음력', m: +m[2], d: +m[3] };
      ev.next = nextDate(ev);
      n.events.push(ev);
      all.push(ev);
    });
  });
  return all;
}

function fmtAmount(s) {
  const m = s.replace(/\s/g, '').match(/^([\d,]+)원?(?:[xX×*](\d+))?$/);
  if (!m) return s;
  return Number(m[1].replace(/,/g, '')).toLocaleString('ko-KR') + '원' + (m[2] ? ' × ' + m[2] : '');
}

let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ===== 렌더링 ===== */
function filtered() {
  if (!DATA) return [];
  const p = $('period').value;
  if (p === 'all') return DATA.expenses;
  const d = new Date();
  if (p === '30d') d.setDate(d.getDate() - 30);
  if (p === '3m') d.setMonth(d.getMonth() - 3);
  if (p === '1y') d.setFullYear(d.getFullYear() - 1);
  const cut = ymd(d);
  return DATA.expenses.filter(e => e.d >= cut);
}

function render() {
  $('balance').innerHTML = won(DATA.balance) + '<small>원</small>';
  const events = parseEvents(DATA.notices || []);
  renderAlerts(events);
  renderList();
  renderRules();
}

function renderAlerts(events) {
  let h = '';
  if (DATA.mismatch) {
    h += '<div class="alert warn"><svg class="i" viewBox="0 0 24 24"><use href="#i-alert"/></svg><div>' +
      '<b>장부 잔액과 계산 잔액이 다릅니다.</b><br>장부(L열) ' + won(DATA.ledgerBalance) + '원 · 계산 ' + won(DATA.balance) + '원</div></div>';
  }
  events.filter(e => e.next && e.next.days <= ALERT_DAYS)
    .sort((a, b) => a.next.days - b.next.days)
    .forEach(e => {
      h += '<div class="alert event"><svg class="i" viewBox="0 0 24 24"><use href="#i-cal"/></svg><div>' +
        '<b>' + esc(e.label) + '</b> · ' + shortDate(e.next.date) + (e.lunar ? ' · 음력 ' + e.m + '/' + e.d : '') +
        '</div><span class="dd">' + (e.next.days ? 'D-' + e.next.days : '오늘') + '</span></div>';
    });
  $('alerts').innerHTML = h;
}

function renderList() {
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  page = Math.min(Math.max(1, page), pages);
  $('count').textContent = list.length ? list.length + '건' : '';

  const items = list.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  $('rows').innerHTML = items.length ? items.map(e => {
    const c = classify(e.t);
    return '<div class="row">' +
      '<div class="date">' + dot(e.d) + '</div>' +
      '<div class="cat" style="background:' + c.bg + ';color:' + c.fg + '" title="' + c.name + '" aria-label="' + c.name + '"><svg class="i" viewBox="0 0 24 24"><use href="#c-' + c.icon + '"/></svg></div>' +
      '<div class="body"><div class="t">' + esc(e.t || '(항목 없음)') + '</div>' +
      '<div class="c">' + dot(e.d) + '</div></div>' +
      '<div class="amt">' + won(e.a) + '</div></div>';
  }).join('') : '<div class="empty">해당 기간의 지출 내역이 없습니다.</div>';

  renderPager(pages);
}

function renderPager(pages) {
  const el = $('pager');
  if (pages <= 1) { el.innerHTML = ''; return; }
  let start = Math.max(1, page - 2), end = Math.min(pages, start + 4);
  start = Math.max(1, end - 4);
  let h = '<button data-p="' + (page - 1) + '"' + (page === 1 ? ' disabled' : '') + ' aria-label="이전"><svg class="i" viewBox="0 0 24 24"><use href="#i-left"/></svg></button>';
  for (let i = start; i <= end; i++) h += '<button data-p="' + i + '"' + (i === page ? ' class="on" aria-current="page"' : '') + '>' + i + '</button>';
  h += '<button data-p="' + (page + 1) + '"' + (page === pages ? ' disabled' : '') + ' aria-label="다음"><svg class="i" viewBox="0 0 24 24"><use href="#i-right"/></svg></button>';
  el.innerHTML = h;
}

function renderRules() {
  const n = (DATA && DATA.notices) || [];
  $('rules').innerHTML = n.length ? n.map(r => {
    const next = (r.events || []).filter(e => e.next).map(e =>
      '<br><span class="next">' + (e.who ? esc(e.who) + ' ' : '') + fullDate(e.next.date) + ' · ' +
      (e.next.days ? 'D-' + e.next.days : '오늘') + '</span>').join('');
    return '<div class="rule"><h4>' + esc(r.name) + '</h4><dl>' +
      (r.amount ? '<dt>금액</dt><dd>' + esc(fmtAmount(r.amount)) + '</dd>' : '') +
      (r.date ? '<dt>날짜</dt><dd>' + esc(r.date) + next + '</dd>' : '') + '</dl></div>';
  }).join('') : '<div class="empty">등록된 ' + RULES_NAME + '이 없습니다.</div>';
}

function showSkeleton() {
  $('count').textContent = '';
  $('pager').innerHTML = '';
  $('rows').innerHTML = Array.from({ length: 6 }, () =>
    '<div class="row"><div class="date"><div class="sk" style="width:62px"></div></div>' +
    '<div class="cat" style="background:#f1f4f9"></div>' +
    '<div class="body"><div class="sk" style="width:70%"></div><div class="sk" style="width:40%;margin-top:8px;height:10px"></div></div>' +
    '<div class="sk" style="width:64px"></div></div>').join('');
}

/* ===== 데이터 흐름 ===== */
async function load(silent) {
  const token = store.get();
  if (!token) return showPin();
  if (!DATA) showSkeleton();
  try {
    const r = await call('getData', token);
    if (!r.ok && r.error === 'AUTH') { store.del(); return showPin(); }
    if (!r.ok) throw new Error(r.error);
    DATA = r.data;
    render();
    if (silent) toast('최신 내용으로 업데이트했습니다');
  } catch (e) {
    toast('불러오지 못했습니다. 잠시 후 다시 시도해 주세요');
  }
}

function logout() {
  store.del();
  DATA = null;
  $('balance').textContent = '—';
  $('alerts').innerHTML = '';
  $('rows').innerHTML = '';
  $('count').textContent = '';
  $('pager').innerHTML = '';
  showPin();
}

/* ===== 비밀번호 ===== */
function showPin() {
  pin = '';
  $('pinMsg').textContent = '';
  drawDots();
  $('pin').classList.add('show');
}
function drawDots() {
  [...$('dots').children].forEach((s, i) => s.classList.toggle('on', i < pin.length));
}
function pressKey(k) {
  if (busy) return;
  if (k === 'del') pin = pin.slice(0, -1);
  else if (pin.length < 4) pin += k;
  $('pinMsg').textContent = '';
  drawDots();
  if (pin.length === 4) submitPin();
}
async function submitPin() {
  busy = true;
  const dots = $('dots');
  dots.classList.add('busy');
  try {
    const r = await call('login', pin);
    if (r.ok) {
      store.set(r.token);
      DATA = r.data;
      page = 1;
      $('pin').classList.remove('show');
      render();
    } else {
      $('pinMsg').textContent = r.error === 'LOCKED' ? '시도 횟수를 초과했습니다. 10분 후 다시 시도해 주세요.'
        : r.error === 'WRONG' ? '비밀번호가 올바르지 않습니다.'
        : '서버 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
      dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
    }
  } catch (e) {
    $('pinMsg').textContent = '연결에 실패했습니다. 다시 시도해 주세요.';
  }
  dots.classList.remove('busy');
  pin = '';
  drawDots();
  busy = false;
}

/* ===== 메뉴 / 시트 ===== */
function openMenu() { $('menu').classList.add('show'); $('scrim').classList.add('show'); }
function openSheet() { $('sheet').classList.add('show'); $('scrim').classList.add('show'); lockScroll(); }
function closeAll() { ['menu', 'sheet', 'scrim'].forEach(id => $(id).classList.remove('show')); unlockScroll(); }

// 회비 규칙 창이 떠 있는 동안 뒤 화면 고정 (iOS 사파리 포함)
let lockedY = null;
function lockScroll() {
  if (lockedY !== null) return;
  lockedY = window.scrollY;
  Object.assign(document.body.style, { position: 'fixed', top: -lockedY + 'px', left: '0', right: '0', overflow: 'hidden' });
}
function unlockScroll() {
  if (lockedY === null) return;
  Object.assign(document.body.style, { position: '', top: '', left: '', right: '', overflow: '' });
  window.scrollTo(0, lockedY);
  lockedY = null;
}

/* ===== 이벤트 ===== */
document.querySelectorAll('.rules-name').forEach(el => el.textContent = RULES_NAME);
$('today').textContent = fullDate(today0());
$('pad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) pressKey(b.dataset.k); });
document.addEventListener('keydown', e => {
  if ($('pin').classList.contains('show')) {
    if (/^[0-9]$/.test(e.key)) pressKey(e.key);
    else if (e.key === 'Backspace') pressKey('del');
  } else if (e.key === 'Escape') closeAll();
});
$('menuBtn').addEventListener('click', openMenu);
$('scrim').addEventListener('click', closeAll);
$('sheetClose').addEventListener('click', closeAll);
$('menu').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const act = b.dataset.act;
  closeAll();
  if (act === 'refresh') load(true);
  if (act === 'rules') openSheet();
  if (act === 'logout') logout();
});
$('period').addEventListener('change', () => { page = 1; renderList(); });
$('pager').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  page = Number(b.dataset.p);
  renderList();
  document.querySelector('.list').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

load();
</script>
</body>
